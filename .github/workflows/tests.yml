name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Los tests usan solo datos sinteticos: no descargan el dataset.
      - name: Tests (pytest)
        run: pytest
